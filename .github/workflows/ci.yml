name: ✅ CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 📚 Dependencias
        run: pnpm install --frozen-lockfile

      - name: 🔎 Tipos
        run: pnpm typecheck

      - name: 🧪 Tests
        run: pnpm test

      - name: 🏗️ Build
        run: pnpm build
